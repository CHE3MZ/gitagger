version: '3'

tasks:
  default:
    cmds:
      - task: ops
        ignore_error: true
      - task: build
      - task: lint
        ignore_error: true
      - task: test
        ignore_error: true
      - task: scan
        ignore_error: true
  ops:
    desc: Run scripts in scripts/ops
    cmds:
      - sh scripts/ops/go-bugcheck.sh
      - sh scripts/ops/go-seccheck.sh
  lint:
    desc: Run golangci-lint.
    cmds:
      - golangci-lint run ./...
  test:
    desc: Run go tests via script.
    cmds:
      - sh scripts/test.sh
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
  cliff:
    desc: Run git cliff
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --unreleased --strip all
  build:
    cmds:
      - \scripts\\build-windows.bat
  self-release:
    cmds:
      - gitagger
  ls-tags:
    cmds:
      - gitagger ls
