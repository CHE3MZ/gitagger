version: '3'

tasks:
  default:
    cmds:
      - task: build
      - task: lint
      - task: scan
  ops:
    desc: Run scripts in scripts/ops
    cmds:
      - sh scripts/ops/ops.sh
  lint:
    desc: Run golangci-lint.
    cmds:
      - sh scripts/ops/lint.sh
  test:
    desc: Run go tests via script.
    cmds:
      - sh scripts/test.sh
  other:
    desc: Run other tasks.
    cmds:
      - sh scripts/task-other.sh
  build:
    cmds:
      - \scripts\\build-windows.bat
  build-site:
    cmds:
      - cd docs && mkdocs build
  check-links:
    cmds:
      - cmd: lychee .
  ci:
    desc: Run all jobs in .ci/jobs
    cmds:
      - sh .ci/utility/run-jobs.sh
  cliff:
    desc: Run git cliff
    silent: true
    env:
      RUST_LOG: off
    cmds:
      - git-cliff --unreleased --strip all
  scan:
    desc: Run other ops tools on the repo.
    cmds:
      - cmd: opengrep scan
      - cmd: osv-scanner scan .
      - cmd: gitleaks git . --no-banner
      - cmd: scorecard --local . --format json | gron
  self-release:
    cmds:
      - gitagger
  demo-help:
    cmds:
      - cmd: termframe --syntax-theme github-dark -o assets/demo-help.svg gitagger help
