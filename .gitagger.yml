scale: patch
pre: stable
format: triple
custom: ""
remote: origin
push: true
force: false
require_clean: false
doctor: true
verbose: false
message: "This Tag was generated by Gitagger."
on:
  failure:
    - shell: sh
      os: linux, macos 
      run: echo "Oops! Something went wrong..."
    - shell: batch
      os: windows
      run: echo "Oops! Something went wrong..."
  success:
    - shell: sh
      os: linux, macos, windows
      run: sh release.sh