version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unused
    - misspell
  disable:
    - gochecknoglobals
    - wsl
    - funlen
    - nlreturn
  settings:
    staticcheck:
      checks:
        - all
        - -SA1019
        - -ST1000
    gosec:
      excludes:
        - G115
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
