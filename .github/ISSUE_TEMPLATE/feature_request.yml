name: Feature request
description: Propose something new for gitagger.
title: "[feat]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Small, focused proposals get built fastest — one thing per issue.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, or what's painful about the current way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? A CLI sketch helps (e.g. `gitagger view v1.2.3` prints ...).
      placeholder: |
        `gitagger view v1.2.3` should show the tag message, commit, and date.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, and why they fall short (including "do nothing").
  - type: checkboxes
    id: pr
    attributes:
      label: Are you willing to implement this?
      options:
        - label: I'm willing to open a PR for this (see CONTRIBUTING.md)
