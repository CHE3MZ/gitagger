name: GHCR

# Publishes the container image to ghcr.io/che3mz/gitagger.
# Three ways in: version tags push (semver + latest), a manual dispatch
# (build only, nothing pushed), or a call from the Gitagger release
# workflow right after tagging (see .github/workflows/gitagger.yml).
# No secrets needed: the runner's own GITHUB_TOKEN logs in.
# NOTE: the first push creates a PRIVATE package — flip it to public
# once in Package settings.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish this existing tag (empty verifies the build only)'
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v1.2.3)'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve publish target
        id: pub
        run: |
          {
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"
            fi
            if [ -n "$TAG" ]; then
              echo "push=true"
              echo "version=$TAG"
              printf 'tags<<EOF\nghcr.io/che3mz/gitagger:%s\nghcr.io/che3mz/gitagger:latest\nEOF\n' "$TAG"
            else
              echo "push=false"
              echo "version=dev"
              echo "tags=ghcr.io/che3mz/gitagger:dev"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.pub.outputs.push == 'true' }}
          tags: ${{ steps.pub.outputs.tags }}
          labels: |
            org.opencontainers.image.title=gitagger
            org.opencontainers.image.description=Automate git tags without the headache.
            org.opencontainers.image.source=https://github.com/CHE3MZ/gitagger
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GITAGGER_VERSION=${{ steps.pub.outputs.version }}
