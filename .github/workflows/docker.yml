name: Docker

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    name: build + container tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # Optional: set the DOCKER_HUB_AUTH repo variable to 'true' plus
      # DOCKER_HUB_USERNAME + DOCKER_HUB_TOKEN secrets, and pulls use
      # your own quota instead of the shared runner quota. Without them
      # this step skips and pulls stay anonymous.
      - name: Log in to Docker Hub
        if: vars.DOCKER_HUB_AUTH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: build image (amd64, tested below)
        run: docker buildx build --platform linux/amd64 -t gitagger:test --load .
      - name: prove arm64 builds
        run: docker buildx build --platform linux/arm64 .
      - name: container tests (logs kept)
        run: sh scripts/docker-test.sh gitagger:test
      - name: upload docker logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: docker-test-logs
          path: logs/docker-test.txt
