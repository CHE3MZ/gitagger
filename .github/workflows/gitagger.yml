name: Gitagger

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tag bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install goreleaser
        run: |
          go install github.com/goreleaser/goreleaser/v2@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install git-cliff
        run: |
          tmp="$(mktemp -d)"
          curl -fsSL -o "$tmp/cliff.tar.gz" https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$tmp/cliff.tar.gz" -C "$tmp"
          sudo install -m 755 "$(find "$tmp" -name git-cliff -type f | head -n 1)" /usr/local/bin/git-cliff
          git-cliff --version
      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: CHE3MZ/gitagger@v1
        with:
          args: ${{ inputs.bump }}
