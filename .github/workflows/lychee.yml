name: Links

# Dead-link check, monthly plus manual runs. Read-only, never touches code.

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  lychee:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --no-progress './**/*.md'
