name: Release

# Publishes a release for every vX.Y.Z tag push (prereleases included):
#   - GoReleaser builds and uploads all platform archives
#   - stable releases update the CHE3MZ/homebrew-tools formula
# Tagging stays independent: run gitagger yourself, push the tag, and this
# workflow picks it up. It never calls, and is never called by, gitagger.
# Manual runs publish the formula for an existing stable release without
# rebuilding it.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag, e.g. v1.1.9'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        env:
          OUTPUT: ${{ runner.temp }}/RELEASE_NOTES.md
        with:
          config: cliff.toml
          args: --latest --strip all
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  homebrew:
    name: publish Homebrew formula
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') && !contains(github.event.inputs.tag || github.ref_name, '-') }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$RELEASE_TAG is not a stable vX.Y.Z release tag"
            exit 1
          fi
      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CHE3MZ/homebrew-tools
          token: ${{ secrets.BREW_TOKEN }}
          path: homebrew-tools
      - name: Download release checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --output "$RUNNER_TEMP/checksums.txt" --clobber
      - name: Generate Homebrew formula
        run: bash scripts/homebrew-formula.sh "$RELEASE_TAG" "$RUNNER_TEMP/checksums.txt" homebrew-tools/Formula/gitagger.rb
      - name: Commit and push Homebrew formula
        working-directory: homebrew-tools
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gitagger.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi
          git commit -m "gitagger $RELEASE_TAG"
          git push
