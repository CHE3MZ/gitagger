# Dogfood: run this repo's own action on every push.
# Uses the released binary (--dry-run creates nothing).
name: Action self-test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  use-local-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitagger version
        uses: ./
        with:
          args: version
      # Dry-run needs an untagged HEAD: release commits carry tags
      # (vX, vX.Y, vX.Y.Z), and gitagger correctly refuses those.
      - name: fresh commit for dry run
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci"
          git commit --allow-empty -qm "dogfood probe"
      - name: gitagger dry run
        uses: ./
        with:
          args: --dry-run

  # Sandbox: prove the action really creates tags, in a throwaway repo
  # (no remote, nothing pushed, nothing touches this repository).
  create-tag-sandbox:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Build sandbox repo
        shell: bash
        run: |
          rm -rf sandbox
          mkdir -p sandbox
          cd sandbox
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git config commit.gpgsign false
          echo hi > f.txt
          git add .
          git commit -qm first
      - name: Create tag via action
        id: tag
        uses: ./
        with:
          working-directory: sandbox
          args: --no-push
      - name: Assert tag created
        shell: bash
        run: |
          [ "${{ steps.tag.outputs.tag }}" = "v1.0.0" ] || { echo "expected v1.0.0, got '${{ steps.tag.outputs.tag }}'"; exit 1; }
          git -C sandbox tag --list | grep -qx "v1.0.0"
