name: CI

# Every check that validates the repo lives here: one job per suite, each on
# its own runner so a Windows-only or Docker-only break fails in isolation.
# Test jobs run on push/PR/dispatch, the monthly link check runs on its
# schedule, and PR titles are validated on pull requests. The token is
# read-only; releases (release.yml) and publishing (container.yml) stay out.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + vet + test
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test (logs kept)
        run: |
          mkdir -p logs
          go test ./... -v 2>&1 | tee logs/go-test.txt
      - name: upload test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-test-logs
          path: logs/go-test.txt

  ops-lint:
    name: ops scripts (bugcheck + seccheck)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install lint tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/kisielk/errcheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/tools/gopls@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: bugcheck
        run: bash scripts/ops/go-bugcheck.sh
      - name: seccheck
        run: bash scripts/ops/go-seccheck.sh
      - name: upload ops logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ops-logs
          path: logs/

  action-lint:
    name: actionlint (repo)
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: lint repo workflows
        run: actionlint .github/workflows/*.yml

  cross-build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
          - goos: windows
            goarch: arm64
            suffix: .exe
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: go build -trimpath -o "build/gitagger-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}" ./cmd/gitagger
      - name: upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitagger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/gitagger-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  use-local-action:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitagger version
        uses: ./
        with:
          args: version
      # Dry-run needs an untagged HEAD: release commits carry tags
      # (vX.Y.Z), and gitagger correctly refuses those.
      - name: fresh commit for dry run
        run: |
          git config user.email "ci@example.com"
          git config user.name "ci"
          git commit --allow-empty -qm "dogfood probe"
      - name: gitagger dry run
        uses: ./
        with:
          args: --dry-run

  create-tag-sandbox:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build sandbox repo
        shell: bash
        run: |
          rm -rf sandbox
          mkdir -p sandbox
          cd sandbox
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git config commit.gpgsign false
          echo hi > f.txt
          git add .
          git commit -qm first
      - name: Create tag via action
        id: tag
        uses: ./
        with:
          working-directory: sandbox
          args: --no-push
      - name: Assert tag created
        shell: bash
        run: |
          [ "${{ steps.tag.outputs.tag }}" = "v1.0.0" ] || { echo "expected v1.0.0, got '${{ steps.tag.outputs.tag }}'"; exit 1; }
          tags=$(git -C sandbox tag --list)
          grep -qx "v1.0.0" <<< "$tags"

  docker:
    name: build + container tests
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Optional: set the DOCKER_HUB_AUTH repo variable to 'true' plus
      # DOCKER_HUB_USERNAME + DOCKER_HUB_TOKEN secrets, and pulls use
      # your own quota instead of the shared runner quota. Without them
      # this step skips and pulls stay anonymous.
      - name: Log in to Docker Hub
        if: vars.DOCKER_HUB_AUTH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - name: build image (amd64, tested below)
        run: docker buildx build --platform linux/amd64 -t gitagger:test --load .
      - name: prove arm64 builds
        run: docker buildx build --platform linux/arm64 .
      - name: container tests (logs kept)
        run: sh scripts/docker-test.sh gitagger:test
      - name: upload docker logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docker-test-logs
          path: logs/docker-test.txt

  sandbox:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build sandbox repo
        shell: bash
        run: |
          rm -rf sandbox
          mkdir -p sandbox
          cd sandbox
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git config commit.gpgsign false
          echo hi > f.txt
          git add .
          git commit -qm first
          git tag v1.0.0
          printf 'push: false\non:\n  success:\n    - run: echo hi > sandbox-marker\n' > .gitagger.yml
          git add .gitagger.yml
          git commit -qm config
      - name: Build gitagger
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          go build -trimpath -o "gt$exe" ./cmd/gitagger
      - name: Run gitagger test
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          ./gt$exe test -p sandbox
      - name: Assert repo untouched
        shell: bash
        run: |
          [ "$(git -C sandbox tag --list)" = "v1.0.0" ] || { echo "real repo tags changed:"; git -C sandbox tag --list; exit 1; }
          [ ! -f sandbox/sandbox-marker ] || { echo "hook marker leaked into the real repo"; exit 1; }
          echo "real repo untouched, sandbox cleaned up"

  platforms:
    name: platforms (${{ matrix.os }})
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: full test suite
        shell: bash
        run: |
          mkdir -p logs
          go vet ./...
          go test ./... -count=1 2>&1 | tee "logs/go-test-${{ matrix.os }}.txt"
          test "${PIPESTATUS[0]}" -eq 0
      - name: CLI smoke (every command)
        shell: bash
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          go build -trimpath -o "gt$exe" ./cmd/gitagger
          rm -rf smoke && mkdir smoke && cd smoke
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci"
          git config commit.gpgsign false
          echo hi > f.txt
          git add . && git commit -qm first
          ../gt$exe version
          ../gt$exe help view
          ../gt$exe rm --help
          ../gt$exe --dry-run
          ../gt$exe --no-push -m hello
          list_out=$(NO_COLOR=1 ../gt$exe list)
          grep -qx "v1.0.0" <<< "$list_out"
          ../gt$exe view v1.0.0
          ../gt$exe init
          ../gt$exe check -v
          ../gt$exe doctor
          ../gt$exe handbook > /dev/null
          if ../gt$exe remote --show; then echo "remote without remote should fail"; exit 1; fi
          if ../gt$exe hlp; then echo "typo should fail"; exit 1; fi
          if ../gt$exe view v9.9.9; then echo "missing tag should fail"; exit 1; fi
          ../gt$exe test
          ../gt$exe remove v1.0.0 -c
          [ -z "$(git tag --list)" ] || { echo "tag not removed"; exit 1; }
      - name: upload platform logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-logs-${{ matrix.os }}
          path: logs/

  links:
    name: link check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --no-progress './**/*.md'

  pr-title:
    name: conventional title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Repo convention (tweak: is ours, the rest are standard).
          types: |
            feat
            fix
            tweak
            chore
            docs
            test
            refactor
          requireScope: false
