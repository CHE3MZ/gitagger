name: Container

# Publishes the container image to ghcr.io/che3mz/gitagger.
# Two ways in: version tags push (semver + latest), or a manual dispatch
# (build only, nothing pushed). Tagging and releases are independent of
# gitagger: a v tag pushed with trigger-capable credentials fires this.
# No secrets needed: the runner's own GITHUB_TOKEN logs in.
# NOTE: the first push creates a PRIVATE package. Flip it to public
# once in Package settings.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish this existing tag (empty verifies the build only)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  publish:
    name: build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve publish target
        id: pub
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          {
            TAG="$INPUT_TAG"
            if [ -z "$TAG" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"
            fi
            if [ -n "$TAG" ]; then
              echo "push=true"
              echo "version=$TAG"
              printf 'tags<<EOF\nghcr.io/che3mz/gitagger:%s\nghcr.io/che3mz/gitagger:latest\nEOF\n' "$TAG"
            else
              echo "push=false"
              echo "version=dev"
              echo "tags=ghcr.io/che3mz/gitagger:dev"
            fi
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.pub.outputs.push == 'true' }}
          tags: ${{ steps.pub.outputs.tags }}
          labels: |
            org.opencontainers.image.title=gitagger
            org.opencontainers.image.description=Automate git tags without the headache.
            org.opencontainers.image.source=https://github.com/CHE3MZ/gitagger
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            GITAGGER_VERSION=${{ steps.pub.outputs.version }}
