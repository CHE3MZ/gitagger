site_name: Gitagger
site_description: Automate Git Tags with one command!
site_author: CHE3MZ
site_url: https://che3mz.github.io/gitagger/
repo_url: https://github.com/CHE3MZ/gitagger

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Your first tag: getting-started/first-tag.md
  - Usage:
    - Commands: usage/commands.md
    - Tagging: usage/tagging.md
    - Configuration: usage/configuration.md
    - Hooks: usage/hooks.md
  - Automation:
    - GitHub Action: automation/github-action.md
    - Generated workflows: automation/workflows.md
    - Docker: automation/docker.md
  - Help:
    - FAQ & troubleshooting: help/faq.md
    - Contributing: help/contributing.md

theme:
  name: mkdocs
  custom_dir: theme
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  icon: {}
  font:
    text: Eager Naturalist
    code: SF Mono
  static_templates:
    - 404.html
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes