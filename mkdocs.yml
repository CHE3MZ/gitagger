site_name: Gitagger
site_description: Automate Git Tags with one command!
site_author: CHE3MZ
site_url: https://che3mz.github.io/gitagger/
repo_url: https://github.com/CHE3MZ/gitagger

nav:
  - Home: index.md
  - Getting started:
    - Installation: getting-started/installation.md
    - Your first tag: getting-started/first-tag.md
  - Usage:
    - Commands: usage/commands.md
    - Tagging: usage/tagging.md
    - Configuration: usage/configuration.md
    - Hooks: usage/hooks.md
  - Integrations:
    - GitHub Actions: automation/github-action.md
    - Generated workflows: automation/workflows.md
    - Docker: automation/docker.md
  - Help:
    - FAQ & troubleshooting: help/faq.md
    - Contributing: help/contributing.md
  - Legal:
    - Licensing: legal/LICENSE.md

theme:
  name: "material"
  language: en
  logo: assets/icon.png
  favicon: assets/icon.png
  font:
    text: Eager Naturalist
    code: SF Mono
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      scheme: gitagger
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - footnotes
